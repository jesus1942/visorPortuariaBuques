<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Buques Puerto Madryn</title>
  <meta name="description" content="Movimientos de buques del Puerto de Puerto Madryn (APPM): amarres, zarpes y buques anunciados, desde el celular.">
  <meta name="theme-color" content="#0d3b66">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Buques PM">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img src="icons/icon-192.png" alt="" width="34" height="34">
        <div>
          <h1>Buques Puerto Madryn</h1>
          <p id="updated" class="updated">Cargando…</p>
        </div>
      </div>
      <button id="refreshBtn" class="icon-btn" type="button" aria-label="Actualizar datos" title="Actualizar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 12a9 9 0 1 1-2.64-6.36"></path>
          <polyline points="21 3 21 9 15 9"></polyline>
        </svg>
      </button>
    </div>
    <div class="search-row">
      <input id="search" type="search" inputmode="search" placeholder="Buscar buque, tipo o carga (ej: congelado)…" autocomplete="off" aria-label="Buscar buque, tipo o carga">
    </div>
    <nav class="tabs" role="tablist" aria-label="Filtros">
      <button class="tab active" data-tab="actual" role="tab" aria-selected="true">Actual</button>
      <button class="tab" data-tab="zarpados" role="tab" aria-selected="false">Zarpados</button>
      <button class="tab" data-tab="todos" role="tab" aria-selected="false">Todos</button>
    </nav>
  </header>

  <div id="offlineBanner" class="banner hidden">
    Sin conexión: mostrando los últimos datos guardados.
  </div>

  <main id="content" aria-live="polite">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <p>Obteniendo movimientos de buques…</p>
    </div>
  </main>

  <footer class="foot">
    <p id="donateRow"><button id="donateBtn" class="donate" type="button">💙 ¿Te sirve la app? Aportá al alias <b>denovaje</b> — tocá para copiarlo</button></p>
    <p>Datos: <a href="https://appm.com.ar/movbuquesdinamica" target="_blank" rel="noopener">Administración Portuaria de Puerto Madryn</a></p>
    <p class="foot-small">Idea y proyecto: <a href="https://github.com/jesus1942" target="_blank" rel="noopener">@jesus1942</a></p>
    <p class="foot-small">App no oficial · Se actualiza automáticamente cada 10 minutos</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
